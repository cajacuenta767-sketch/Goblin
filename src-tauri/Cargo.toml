[package]
name = "goblin"
version = "0.1.0"
description = "GOBLIN — IDE local con IA para ciberseguridad"
authors = ["cajacuenta767-sketch"]
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# default Tauri feature flags
custom-protocol = ["tauri/custom-protocol"]
